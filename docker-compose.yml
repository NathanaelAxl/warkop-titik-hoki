# Postgres lokal untuk development (opsional).
# Jalankan: docker compose up -d
# DATABASE_URL="postgresql://postgres:postgres@localhost:5432/warkop"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warkop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
